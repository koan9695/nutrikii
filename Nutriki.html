<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutriki</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .question {
            margin-bottom: 20px;
        }
        .question p {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }
        button {
            background-color:  #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        button:hover {
            background-color:  #007bff;
        }
        #result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #e9ecef;
            border-left: 5px solid #007bff;
            border-radius: 4px;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>Nutritional Suggestion Via Nutriki</h2>
    
    <form id="quizForm">
        <!-- Question 1 -->
        <div class="question">
            <p>1. Please Select Your Age Range:</p>
            <div class="options">
                <label><input type="radio" name="q1" value="A" required> 0-12 months </label>
                <label><input type="radio" name="q1" value="B"> 1-3</label>
                <label><input type="radio" name="q1" value="C"> 4-8</label>
                <label><input type="radio" name="q1" value="D"> 9-13</label>
                <label><input type="radio" name="q1" value="E"> 14-18</label>
                <label><input type="radio" name="q1" value="F"> 19-30</label>
                <label><input type="radio" name="q1" value="G"> 31-50</label>
                <label><input type="radio" name="q1" value="H"> 51-70</label>
                <label><input type="radio" name="q1" value="I"> 71+</label>
            </div>
        </div>

        <!-- Question 2 -->
        <div class="question">
            <p>2. Plaese Select Your Gender:</p>
            <div class="options">
                <label><input type="radio" name="q2" value="A"> Male</label>
                <label><input type="radio" name="q2" value="B"> Female</label>
                <label><input type="radio" name="q2" value="C"> Rather Not Say</label>
            </div>
        </div>

        <button type="button" onclick="calculateResult()">Submit Answers</button>
    </form>


    <!-- Result Display Section -->
    <div id="result-box">
        <h3>Nutriki Suggestion:</h3>
        <p id="result-text"></p>
    </div>
</div>

<script>
function calculateResult() {
    // 1. Get the form element
    const form = document.getElementById('quizForm');
    
    // 2. Extract selected radio button values using FormData API
    const formData = new FormData(form);
    const q1 = formData.get('q1');
    const q2 = formData.get('q2');

    // 3. Ensure all questions are answered before calculating
    if (!q1 || !q2) {
        alert("Please answer all questions before submitting!");
        return;
    }


    // 5. Conditional Logic: Evaluate results based on choice majorities
    let feedback = "";
   //male
    if (q1 == 'A' && q2 == "A") {
        feedback = "<strong>The Lone Wolf:</strong> Statistics for a male aged 0-12 months";
    } else if (q1 == 'B' && q2 == "A") {
        feedback = "<strong>The Strategic Planner:</strong> Statistics for a male aged 1-3";
    } else if (q1 == 'C' && q2 == "A") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a male aged 4-8";
    } else if (q1 == 'D' && q2 == "A") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a male aged 9-13";
    } else if (q1 == 'E' && q2 == "A") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a male aged 14-18";
    } else if (q1 == 'F' && q2 == "A") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a male aged 19-30";
    } else if (q1 == 'G' && q2 == "A") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a male aged 31-50";
    } else if (q1 == 'H' && q2 == "A") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a male aged 51-70";
    } else if (q1 == 'I' && q2 == "A") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a male aged 71+";
    }


    //female
    else if (q1 == 'A' && q2 == "B") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a female aged 0-12 months";
    } else if (q1 == 'B' && q2 == "B") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a female aged 1-3";
    } else if (q1 == 'C' && q2 == "B") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a female aged 4-8";
    } else if (q1 == 'D' && q2 == "B") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a female aged 9-13";
    } else if (q1 == 'E' && q2 == "B") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a female aged 14-18";
    } else if (q1 == 'F' && q2 == "B") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a female aged 19-30";
    } else if (q1 == 'G' && q2 == "B") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a female aged 31-50";
    } else if (q1 == 'H' && q2 == "B") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a female aged 51-70";
    } else if (q1 == 'I' && q2 == "B") {
        feedback = "<strong>The Catalyst:</strong> Statistics for a female aged 71+";
    }

    //Rather not say
    else if (q1 == 'A' && q2 == "C") {
        feedback = "<strong>The Catalyst:</strong> Generally, statistics for someone aged 0-12 months";
    } else if (q1 == 'B' && q2 == "C") {
        feedback = "<strong>The Catalyst:</strong> Generally, statistics for a someone aged 1-3";
    } else if (q1 == 'C' && q2 == "C") {
        feedback = "<strong>The Catalyst:</strong> Generally, statistics for a someone aged 4-8";
    } else if (q1 == 'D' && q2 == "C") {
        feedback = "<strong>The Catalyst:</strong> Generally, statistics for a someone aged 9-13";
    } else if (q1 == 'E' && q2 == "C") {
        feedback = "<strong>The Catalyst:</strong> Generally, statistics for a someone aged 14-18";
    } else if (q1 == 'F' && q2 == "C") {
        feedback = "<strong>The Catalyst:</strong> Generally, statistics for a someone aged 19-30";
    } else if (q1 == 'G' && q2 == "C") {
        feedback = "<strong>The Catalyst:</strong> Generally, statistics for a someone aged 31-50";
    } else if (q1 == 'H' && q2 == "C") {
        feedback = "<strong>The Catalyst:</strong> Generally, statistics for a someone aged 51-70";
    } else if (q1 == 'I' && q2 == "C") {
        feedback = "<strong>The Catalyst:</strong> Generally, statistics for a someone aged 71+";
    }
        // 6. Display the feedback dynamically
    const resultBox = document.getElementById('result-box');
    const resultText = document.getElementById('result-text');
    
    resultText.innerHTML = feedback;
    resultBox.style.display = 'block'; // Make the hidden result container visible
}
</script>

</body>
</html>
